# Publishes the website with the most recent data runs (GitHub Releases). See publishing-data.md.
# The finished site (code + data) is pushed as a single commit to the gh-pages branch, which GitHub Pages
# serves. A new commit per deploy means new data always goes live, and old data doesn't pile up in git.
name: Deploy website

on:
  release:
    types: [published, deleted]
  push:
    branches: [main]
    paths: ["site/**", "tests/**", "tools/build_site_data.py", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RUNS_ON_SITE: 4  # the most recent runs are viewable on the site; all runs stay downloadable as releases

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}  # a release points at a tag; always use the current code

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the ranking logic
        run: node tests/engine.test.mjs

      - name: Download the most recent data runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir runs
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit "$RUNS_ON_SITE" --json tagName --jq '.[].tagName')
          for tag in $tags; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "runs/$tag"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the data and add it to the site
        run: |
          pip install pyarrow
          python tools/build_site_data.py runs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"

      - name: Publish the site to the gh-pages branch
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Website built from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
